<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Drako Space</title>
  <!-- Cargamos la librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0d0203;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .register-card {
      background-color: #1a080a;
      border: 1px solid #4a0e17;
      border-radius: 16px;
      padding: 32px 28px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 8px 32px rgba(239, 35, 60, 0.15);
      text-align: center;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ef233c;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #4a0e17;
      background-color: #0d0203;
      color: #ffffff;
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
    }

    .input-group input:focus {
      border-color: #ef233c;
    }

    .btn-register {
      width: 100%;
      background-color: #d90429;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-register:hover {
      background-color: #ef233c;
    }

    #msg {
      margin-top: 14px;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .login-link {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #888;
    }

    .login-link a {
      color: #ef233c;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="logo">drako.space</div>
    <p class="subtitle">Crea tu cuenta para unirte a la red</p>

    <form id="registerForm">
      <div class="input-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" placeholder="@tuusuario" required>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@correo.com" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-register">Crear Cuenta</button>
    </form>

    <div id="msg"></div>

    <div class="login-link">
      ¿Ya tienes cuenta? <a href="feed.html">Inicia sesión</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yootqehzqmvchmodpvadx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_D9NHsuSDvZHwMllHpdydVw_pPNyVtfL'; // PEGA AQUÍ TU PUBLISHABLE KEY COMPLETA

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.color = "#ffffff";
      msg.textContent = "Conectando...";

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim();

      try {
        // 1. Registro en Supabase Auth
        const { data, error } = await db.auth.signUp({
          email: email,
          password: password
        });

        if (error) {
          msg.style.color = "#ef233c";
          msg.textContent = "Error al registrar: " + error.message;
          return;
        }

        // 2. Insertar perfil en la tabla 'perfiles'
        if (data.user) {
          const { error: profileError } = await db.from('perfiles').insert([
            { id: data.user.id, username: username }
          ]);

          if (profileError) {
            msg.style.color = "#ef233c";
            msg.textContent = "Error al guardar perfil: " + profileError.message;
          } else {
            msg.style.color = "#4EDA52";
            msg.textContent = "¡Cuenta creada con éxito! Redirigiendo...";
            
            localStorage.setItem('usuario_actual', username);

            setTimeout(() => {
              window.location.href = 'feed.html';
            }, 1200);
          }
        }
      } catch (err) {
        msg.style.color = "#ef233c";
        msg.textContent = "Error de red o conexión: " + err.message;
      }
    });
  </script>

</body>
</html>
