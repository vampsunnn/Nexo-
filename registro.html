<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Nexo Space</title>
  <style>
    /* Estilos globales */
    body {
      background-color: #0d0203;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Tarjeta del Formulario */
    .register-card {
      background-color: #1a080a;
      border: 1px solid #4a0e17;
      border-radius: 16px;
      padding: 32px 28px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(239, 35, 60, 0.15);
      text-align: center;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ef233c;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    /* Estilos de los inputs del formulario */
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #4a0e17;
      background-color: #0d0203;
      color: #ffffff;
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #ef233c;
    }

    /* Botón de Registro */
    .btn-register {
      width: 100%;
      background-color: #d90429;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-register:hover {
      background-color: #ef233c;
      transform: scale(1.02);
    }

    .login-link {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #888;
    }

    .login-link a {
      color: #ef233c;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="logo">drako.space</div>
    <p class="subtitle">Crea tu cuenta para unirte a la red</p>

    <form action="feed.html">
      <div class="input-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" placeholder="@tuusuario" required>
      </div>

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@correo.com" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Al hacer clic te redirige directamente al feed -->
      <button type="submit" class="btn-register">Crear Cuenta</button>
    </form>

    <div class="login-link">
      ¿Ya tienes cuenta? <a href="feed.html">Inicia sesión</a>
    </div>
  </div>

</body>
</html>
